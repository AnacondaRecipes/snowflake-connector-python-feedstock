{% set name = "snowflake-connector-python" %}
{% set version = "5.0.0b1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
    sha256: 17ea11f28f53dc6a41eb35cf4348ee58d9ea7f2c4cc32011cc82fbfef66519ba
  - url: https://github.com/snowflakedb/universal-driver/archive/refs/tags/snowflake-connector-python/5.0.0b1.tar.gz
    sha256: 1590883e41062531a26214769e7cc73b242c7f1ac1d138134ddbded674cfea4c
    folder: gh_src

build:
  number: 100
  script:
    # The Rust kernel sf_core pulls native OpenSSL (openssl crate in sf_core/Cargo.toml).
    # Without the vendored-openssl feature, by default it goes through openssl-sys and finds OpenSSL in the system:
    - export OPENSSL_DIR=$PREFIX  # [unix]
    - export OPENSSL_LIB_DIR=$PREFIX/lib  # [unix]
    - export OPENSSL_INCLUDE_DIR=$PREFIX/include  # [unix]
    - set OPENSSL_DIR=%LIBRARY_PREFIX%  # [win]
    - set OPENSSL_LIB_DIR=%LIBRARY_PREFIX%\lib  # [win]
    - set OPENSSL_INCLUDE_DIR=%LIBRARY_PREFIX%\include  # [win]
    # Use CMake to build aws-lc-sys; more reliable than the default cc-crate
    # builder in conda's Windows toolchain environment.
    - set AWS_LC_SYS_CMAKE_BUILDER=1  # [win]
    - set AWS_LC_SYS_PREBUILT_NASM=1  # [win]
    # vcruntime_c11_stdatomic.h raises - error: "C atomics require C11 or later"
    # skip the jitter entropy code that requires _Atomic
    - set AWS_LC_SYS_NO_JITTER_ENTROPY=1  # [win]
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv
  missing_dso_whitelist:
    - $RPATH/api-ms-win-core-winrt-string-l1-1-0.dll  # [win]
    - $RPATH/api-ms-win-core-winrt-error-l1-1-0.dll  # [win]
    - $RPATH/api-ms-win-core-winrt-l1-1-0.dll  # [win]
    - zlib.dll  # [win]
  skip: true  # [py<39]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('rust') }}
    - cmake  # [win]
    - ninja-base  # [win]
    # thread 'main' (2689) panicked at proto_generator/src/protoc_installer.rs:117:10:
    # Failed to execute unzip.
    - unzip  # [linux]
    # Required by aws-lc-sys
    - nasm  # [win]
  host:
    - python
    - pip
    - hatchling
    - editables
    - cython
    - wheel
    - setuptools
    - mypy-protobuf >=5.0,<6
    # Could not find directory of OpenSSL installation
    - openssl {{ openssl }}
  run:
    - python
    - cryptography >=44.0.1
    - protobuf >=6.32.1
    - pytz
    - tomlkit >=0.13
  run_constrained:
    # pandas
    - pyarrow >=14.0.1
    - pandas >=1.0.0,<3.0.0  # [py<313]
    - pandas >=2.1.2  # [py>=313]

# raise RuntimeError("SNOWFLAKE_TEST_PRIVATE_KEY_CONTENTS not found in test parameters.")
{% set deselect_tests = " --deselect=gh_src/python/tests/unit/test_module.py::TestModuleConnectFunction::test_connect_returns_connection" %}
test:
  source_files:
    - gh_src/python/tests
  imports:
    - snowflake.connector
    - snowflake.connector._core
    - snowflake.connector._internal
    - snowflake.connector.auth
    - snowflake.connector.cursor
    - snowflake.connector.config_manager
    - snowflake.connector.connection
    - snowflake.connector.errors
    - snowflake.connector.result_batch
    - snowflake.connector.util_text
    - snowflake.connector.version
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -v gh_src/python/tests/unit {{ deselect_tests }}
  requires:
    - pip
    - pytest
    - numpy
    - mock
    - cryptography
    - pyarrow >=14.0.1
    - pandas >=1.0.0,<3.0.0  # [py<313]
    - pandas >=2.1.2  # [py>=313]
    - requests

about:
  home: https://github.com/snowflakedb/universal-driver
  summary: A PEP 249 Database API 2.0 implementation for Snowflake
  license: Apache-2.0
  license_family: Apache
  license_file: gh_src/LICENSE
  description: |
    A Python library that implements PEP 249 (Python Database API Specification 2.0)
    with empty interface implementations. This library provides a complete skeleton
    implementation that follows the PEP 249 specification, making it an ideal starting
    point for creating new database drivers or for testing database API compliance.
  doc_url: https://github.com/snowflakedb/universal-driver/blob/main/README.md
  dev_url: https://github.com/snowflakedb/universal-driver

extra:
  recipe-maintainers:
    - hajapy
    - talues
    - xhochy
    - mariusvniekerk
    - fhoehle
  skip-lints:
    - host_section_needs_exact_pinnings
